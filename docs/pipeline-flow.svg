<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 430" width="1160" height="430" role="img" aria-label="SignalStream HQ Webhook Ingestion and Risk Scoring Architecture">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#0d1524"/>
    </linearGradient>
    <marker id="arrowSky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7"/>
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="1160" height="430" rx="14" fill="url(#flowBg)" stroke="#1e2d45" stroke-width="2"/>

  <!-- Header -->
  <text x="34" y="42" fill="#ffffff" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="700">SignalStream HQ — Event-Driven Revenue Intelligence Architecture</text>
  <text x="34" y="62" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">Multi-channel webhook ingestion, SQLite WAL idempotency guard, explainable risk scoring &amp; automated playbook dispatch</text>

  <!-- STAGE 1: Event Sources -->
  <rect x="30" y="92" width="230" height="304" rx="11" fill="#0f1623" stroke="#1e2d45"/>
  <text x="48" y="118" fill="#38bdf8" font-family="Consolas, monospace" font-size="11" font-weight="700">01 · EVENT PRODUCERS</text>

  <rect x="46" y="134" width="198" height="72" rx="8" fill="#162033" stroke="#2b4063"/>
  <text x="60" y="156" fill="#ffffff" font-family="Segoe UI, Inter, sans-serif" font-size="12.5" font-weight="700">Stripe Billing Webhooks</text>
  <text x="60" y="175" fill="#94a3b8" font-family="Consolas, monospace" font-size="10.5">invoice.payment_failed</text>
  <text x="60" y="191" fill="#94a3b8" font-family="Consolas, monospace" font-size="10.5">subscription.updated</text>

  <rect x="46" y="218" width="198" height="72" rx="8" fill="#162033" stroke="#2b4063"/>
  <text x="60" y="240" fill="#ffffff" font-family="Segoe UI, Inter, sans-serif" font-size="12.5" font-weight="700">Product Telemetry</text>
  <text x="60" y="259" fill="#94a3b8" font-family="Consolas, monospace" font-size="10.5">telemetry.usage_drop</text>
  <text x="60" y="275" fill="#94a3b8" font-family="Consolas, monospace" font-size="10.5">telemetry.seat_spike</text>

  <rect x="46" y="302" width="198" height="72" rx="8" fill="#162033" stroke="#2b4063"/>
  <text x="60" y="324" fill="#ffffff" font-family="Segoe UI, Inter, sans-serif" font-size="12.5" font-weight="700">Support Escalations</text>
  <text x="60" y="343" fill="#94a3b8" font-family="Consolas, monospace" font-size="10.5">support.ticket_escalated</text>
  <text x="60" y="359" fill="#94a3b8" font-family="Consolas, monospace" font-size="10.5">P1 / P2 SLA signals</text>

  <!-- Connector 1 -> 2 -->
  <line x1="260" y1="244" x2="306" y2="244" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#arrowSky)"/>

  <!-- STAGE 2: Idempotent Ingestion & SQLite WAL -->
  <rect x="312" y="92" width="245" height="304" rx="11" fill="#0f1623" stroke="#a855f7" stroke-opacity="0.5"/>
  <text x="330" y="118" fill="#d8b4fe" font-family="Consolas, monospace" font-size="11" font-weight="700">02 · IDEMPOTENCY GATEWAY</text>

  <rect x="328" y="134" width="213" height="74" rx="8" fill="#162033" stroke="#2b4063"/>
  <text x="342" y="156" fill="#ffffff" font-family="Segoe UI, Inter, sans-serif" font-size="12.5" font-weight="700">POST /api/events/ingest</text>
  <text x="342" y="176" fill="#7dd3fc" font-family="Consolas, monospace" font-size="10.5">Idempotency-Key Header</text>
  <text x="342" y="193" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="10.5">Schema &amp; payload validation</text>

  <rect x="328" y="220" width="213" height="82" rx="8" fill="#a855f7" fill-opacity="0.12" stroke="#a855f7" stroke-opacity="0.45"/>
  <text x="342" y="242" fill="#e9d5ff" font-family="Segoe UI, Inter, sans-serif" font-size="12.5" font-weight="700">Deduplication Guard</text>
  <text x="342" y="261" fill="#d8b4fe" font-family="Consolas, monospace" font-size="10.5">UNIQUE(idempotency_key)</text>
  <text x="342" y="279" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="10.5">Duplicate retries return 200 OK</text>
  <text x="342" y="294" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="10.5">with zero state mutation</text>

  <rect x="328" y="314" width="213" height="62" rx="8" fill="#162033" stroke="#2b4063"/>
  <text x="342" y="336" fill="#ffffff" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">SQLite WAL Transaction</text>
  <text x="342" y="354" fill="#94a3b8" font-family="Consolas, monospace" font-size="10.5">BEGIN IMMEDIATE → COMMIT</text>

  <!-- Connector 2 -> 3 -->
  <line x1="557" y1="244" x2="603" y2="244" stroke="#a855f7" stroke-width="2.2" marker-end="url(#arrowPurple)"/>

  <!-- STAGE 3: Explainable Scoring Engine -->
  <rect x="609" y="92" width="252" height="304" rx="11" fill="#0f1623" stroke="#38bdf8" stroke-opacity="0.5"/>
  <text x="627" y="118" fill="#7dd3fc" font-family="Consolas, monospace" font-size="11" font-weight="700">03 · SCORING &amp; EXPANSION</text>

  <rect x="625" y="134" width="220" height="158" rx="8" fill="#162033" stroke="#2b4063"/>
  <text x="639" y="156" fill="#ffffff" font-family="Segoe UI, Inter, sans-serif" font-size="12.5" font-weight="700">Composite Churn Risk (0–100)</text>
  <text x="639" y="178" fill="#fb7185" font-family="Consolas, monospace" font-size="10.5">• Usage Velocity Drop   (35 pt)</text>
  <text x="639" y="198" fill="#fbbf24" font-family="Consolas, monospace" font-size="10.5">• Billing &amp; Dunning     (30 pt)</text>
  <text x="639" y="218" fill="#38bdf8" font-family="Consolas, monospace" font-size="10.5">• P1/P2 Support Backlog (20 pt)</text>
  <text x="639" y="238" fill="#a78bfa" font-family="Consolas, monospace" font-size="10.5">• Seat Shelfware Risk   (15 pt)</text>
  <text x="639" y="264" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="10.5">Outputs per-factor severity &amp; reason</text>

  <rect x="625" y="304" width="220" height="72" rx="8" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.45"/>
  <text x="639" y="326" fill="#6ee7b7" font-family="Segoe UI, Inter, sans-serif" font-size="12.5" font-weight="700">Expansion Signal Detector</text>
  <text x="639" y="345" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="10.5">&gt;=88% seats + velocity growth</text>
  <text x="639" y="362" fill="#34d399" font-family="Consolas, monospace" font-size="10.5">Estimates +22% to +32% ARR</text>

  <!-- Connector 3 -> 4 -->
  <line x1="861" y1="244" x2="907" y2="244" stroke="#10b981" stroke-width="2.2" marker-end="url(#arrowEmerald)"/>

  <!-- STAGE 4: Automated Playbooks & Command UI -->
  <rect x="913" y="92" width="217" height="304" rx="11" fill="#0f1623" stroke="#10b981" stroke-opacity="0.5"/>
  <text x="931" y="118" fill="#34d399" font-family="Consolas, monospace" font-size="11" font-weight="700">04 · ACTION &amp; OPS UI</text>

  <rect x="929" y="134" width="185" height="112" rx="8" fill="#162033" stroke="#2b4063"/>
  <text x="943" y="156" fill="#ffffff" font-family="Segoe UI, Inter, sans-serif" font-size="12.5" font-weight="700">Playbook Dispatcher</text>
  <text x="943" y="176" fill="#7dd3fc" font-family="Consolas, monospace" font-size="10.5">SHA-256 dispatch_key</text>
  <text x="943" y="196" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="10.5">• CS Slack Rescue Alert</text>
  <text x="943" y="213" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="10.5">• Finance Dunning Hook</text>
  <text x="943" y="230" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="10.5">• AE Expansion CRM Opp</text>

  <rect x="929" y="260" width="185" height="116" rx="8" fill="#162033" stroke="#38bdf8" stroke-opacity="0.45"/>
  <text x="943" y="282" fill="#ffffff" font-family="Segoe UI, Inter, sans-serif" font-size="12.5" font-weight="700">Command Center UI</text>
  <text x="943" y="302" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="10.5">• Live KPI &amp; Risk Matrix</text>
  <text x="943" y="319" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="10.5">• Telemetry Sparklines</text>
  <text x="943" y="336" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="10.5">• 1-Click Webhook Sim</text>
  <text x="943" y="353" fill="#7dd3fc" font-family="Consolas, monospace" font-size="10.5">• CSV &amp; JSON Export</text>
</svg>
